name: aptino-claim

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/aptino-claim-backend:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gemini-2.5-flash-lite}
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - models:/models
    ports:
      - "${BACKEND_PORT:-8000}:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  frontend:
    image: ${DOCKERHUB_USERNAME}/aptino-claim-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:7860
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  models:
