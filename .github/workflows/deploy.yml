name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "eval_results/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: aptino-claim-backend
  CONTAINER_NAME: aptino-claim-backend
  HOST_PORT: "8000"
  FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-${{ hashFiles('requirements.txt') }}-bge-small-v1.5-bge-reranker-base

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE,CONTAINER_NAME,HOST_PORT
          script_stop: true
          script: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$IMAGE"

            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$HOST_PORT":7860 \
              -e LLM_PROVIDER=offline \
              -e FASTEMBED_CACHE_PATH=/models \
              -v aptino-claim-models:/models \
              "$IMAGE"

            # First boot downloads the embedding/reranker models into the
            # named volume; later deploys reuse it.
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$HOST_PORT/health" >/dev/null; then
                echo "Healthy after $((i * 5))s"
                docker image prune -f
                docker logout
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed; container logs:"
            docker logs --tail 100 "$CONTAINER_NAME"
            docker logout
            exit 1
