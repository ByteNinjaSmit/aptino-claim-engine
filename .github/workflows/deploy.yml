name: Build, push and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "eval_results/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aptino-claim-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aptino-claim-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aptino-claim-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aptino-claim-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: aptino-claim

      - name: Pull and restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          LLM_PROVIDER: openai_compatible
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_INTERPRETATION_MODEL: gemini-3.5-flash
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,LLM_PROVIDER,OPENAI_API_KEY,OPENAI_INTERPRETATION_MODEL
          script_stop: true
          script: |
            cd aptino-claim
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            export DOCKERHUB_USERNAME IMAGE_TAG LLM_PROVIDER OPENAI_API_KEY OPENAI_INTERPRETATION_MODEL
            docker compose pull
            # --wait blocks until backend and frontend healthchecks pass
            # (first boot downloads the models, hence the long timeout).
            docker compose up -d --remove-orphans --wait --wait-timeout 600 \
              || { docker compose logs --tail 80; exit 1; }
            docker image prune -f
            docker logout
